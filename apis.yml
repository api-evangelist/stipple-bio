name: Stipple Bio
description: 'Stipple Bio is a preclinical precision-oncology biotechnology company based in Cambridge,
  Massachusetts, founded in 2022 by cancer-biology researchers Aaron Ring (Fred Hutch) and Aashish Manglik
  (UCSF). Its Pointillist Platform performs cellular profiling and tumor-specific epitope discovery to
  design antibody binders and antibody-drug conjugates (ADCs) that target tumor-specific cell-surface
  epitopes while avoiding on-target, off-tumor toxicity. Its lead asset, STP-100, is an ADC advancing
  toward early clinical studies. The company emerged from stealth in April 2026 with an oversubscribed
  $100M Series A co-led by RA Capital, a16z Bio+Health and Nextech Invest, with participation from Google
  Ventures (gv). As a therapeutics company, Stipple Bio publishes no public API, developer portal, or
  software developer surface.'
